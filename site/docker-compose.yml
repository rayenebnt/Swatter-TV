# Swatter TV : site + base PostgreSQL (VPS, Coolify, Portainer…).
#
# 1. Copier .env.example en .env et renseigner au minimum :
#      POSTGRES_PASSWORD   mot de passe de la base (long et aléatoire)
#      PAYLOAD_SECRET      openssl rand -hex 32
#      CRON_SECRET         openssl rand -hex 16
#      NEXT_PUBLIC_SITE_URL  adresse publique, ex. https://www.swatter-tv.fr
#    (facultatif : POSTGRES_DB, POSTGRES_USER, APP_PORT, NEXT_PUBLIC_BUNNY_LIBRARY_ID, S3_*)
# 2. docker compose up -d --build
#    → la base démarre, les migrations s'appliquent (service « migrate »), puis le site démarre.
# 3. Premier administrateur : ouvrir https://…/admin et créer le compte.
#
# Données persistantes : volumes « pgdata » (base) et « media » (images et vidéos envoyées).
# Sauvegardes : voir README.md.

name: swatter-tv

x-app-env: &app-env
  DATABASE_URI: postgres://${POSTGRES_USER:-swatter}:${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-swatter}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Renseignez PAYLOAD_SECRET dans .env}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  CRON_SECRET: ${CRON_SECRET:-}
  NEXT_PUBLIC_BUNNY_LIBRARY_ID: ${NEXT_PUBLIC_BUNNY_LIBRARY_ID:-}
  # Stockage des médias sur S3 / R2 / Scaleway (facultatif ; sinon volume « media »)
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

x-build-args: &build-args
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  NEXT_PUBLIC_BUNNY_LIBRARY_ID: ${NEXT_PUBLIC_BUNNY_LIBRARY_ID:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swatter}
      POSTGRES_USER: ${POSTGRES_USER:-swatter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  # Applique les migrations Payload (src/migrations) puis s'arrête.
  # Aussi utilisé pour les commandes ponctuelles : docker compose run --rm migrate npm run payload migrate:status
  migrate:
    build:
      context: .
      target: tools
      args: *build-args
    environment: *app-env
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
      args: *build-args
    image: swatter-tv:latest
    restart: unless-stopped
    environment: *app-env
    ports:
      # À placer derrière un reverse proxy HTTPS (Caddy, Traefik, Nginx ou le proxy de Coolify).
      - '${APP_PORT:-3000}:3000'
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  media:
