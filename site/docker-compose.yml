# Swatter TV Info : site + base PostgreSQL + tâche planifiée (VPS, Coolify, Portainer…).
#
# 1. Copier .env.example en .env et renseigner au minimum :
#      POSTGRES_PASSWORD     mot de passe de la base (long et aléatoire)
#      PAYLOAD_SECRET        openssl rand -hex 32
#      CRON_SECRET           openssl rand -hex 16
#      NEXT_PUBLIC_SITE_URL  adresse publique, ex. https://www.swatter-tv.fr (figée dans l'image : la changer impose de reconstruire)
#    (facultatif : POSTGRES_DB, POSTGRES_USER, APP_PORT, NEXT_PUBLIC_BUNNY_LIBRARY_ID, YOUTUBE_API_KEY, S3_*)
#    DATABASE_URI est inutile ici : il est construit à partir des variables POSTGRES_*.
# 2. docker compose up -d --build
#    → la base démarre, les migrations s'appliquent (service « migrate »), puis le site et la tâche planifiée démarrent.
# 3. Premier administrateur, dès le premier démarrage (tant qu'aucun compte n'existe, n'importe qui peut le créer) :
#    docker compose run --rm -e ADMIN_EMAIL=… -e ADMIN_PASSWORD=… tools npm run payload run src/scripts/init-db.ts
#    (ou : ouvrir https://…/admin et créer le compte en choisissant le rôle « Administrateur »).
#
# Commandes ponctuelles (service « tools », jamais démarré par « up ») :
#    docker compose run --rm tools npm run payload migrate:status
#    docker compose run --rm tools npm run import
#    docker compose run --rm -e SEED_FORCE=1 tools npm run seed      (jeu de démonstration : efface les contenus !)
#
# Données persistantes : volumes « pgdata » (base) et « media » (images et vidéos envoyées).
# Sauvegardes et mises à jour : voir README.md.

name: swatter-tv

x-app-env: &app-env
  DATABASE_URI: postgres://${POSTGRES_USER:-swatter}:${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-swatter}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Renseignez PAYLOAD_SECRET dans .env}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Renseignez NEXT_PUBLIC_SITE_URL dans .env}
  CRON_SECRET: ${CRON_SECRET:?Renseignez CRON_SECRET dans .env}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-contact@swatter-tv.fr}
  NEXT_PUBLIC_BUNNY_LIBRARY_ID: ${NEXT_PUBLIC_BUNNY_LIBRARY_ID:-}
  # Import de la chaîne YouTube : toutes les vidéos avec une clé (facultatif ; sinon les 15 dernières)
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  # Stockage des médias sur S3 / R2 / Scaleway (facultatif ; sinon volume « media »)
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  # Reverse proxys en chaîne devant le site (adresse IP des visiteurs pour les limites anti-abus ; 1 par défaut)
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}

# Les variables NEXT_PUBLIC_* sont figées dans le code au moment du build de l'image.
x-build-args: &build-args
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Renseignez NEXT_PUBLIC_SITE_URL dans .env}
  NEXT_PUBLIC_BUNNY_LIBRARY_ID: ${NEXT_PUBLIC_BUNNY_LIBRARY_ID:-}

# Image « tools » du Dockerfile : sources complètes + CLI Payload (migrations, jeu de démonstration, imports).
# Une seule image pour « migrate » et « tools » : « docker compose up -d --build » la reconstruit (service « migrate »),
# donc « docker compose run tools … » n'utilise jamais une version du code plus ancienne que le site.
x-tools: &tools
  image: swatter-tv-tools:latest
  build:
    context: .
    target: tools
    args: *build-args
  environment: *app-env
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swatter}
      POSTGRES_USER: ${POSTGRES_USER:-swatter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  # Applique les migrations Payload (src/migrations) puis s'arrête ; le site attend qu'elles aient réussi.
  migrate:
    <<: *tools
    restart: 'no'

  # Commandes ponctuelles : docker compose run --rm tools <commande>
  tools:
    <<: *tools
    profiles: ['tools']
    restart: 'no'
    command: ['npm', 'run', 'payload', 'migrate:status']

  app:
    build:
      context: .
      target: runner
      args: *build-args
    image: swatter-tv:latest
    restart: unless-stopped
    environment: *app-env
    ports:
      # Écoute locale uniquement : à publier derrière un reverse proxy HTTPS (Caddy, Nginx, Traefik ou le proxy de Coolify).
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Tâche planifiée horaire : météo et chaîne YouTube (GET /api/cron/import, secret transmis dans l'en-tête Authorization).
  # Premier passage dès que le site est prêt, puis toutes les heures ; les échecs sont visibles dans « docker compose logs cron ».
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    init: true
    environment:
      CRON_SECRET: ${CRON_SECRET:?Renseignez CRON_SECRET dans .env}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          echo "$$(date -u '+%F %T') import météo + YouTube"
          curl -fsS --max-time 300 -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/import || echo "échec de l'import"
          echo
          sleep 3600
        done
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  media:
